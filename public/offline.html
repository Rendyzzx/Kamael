<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cyronime — Kamu sedang offline</title>
<link rel="icon" href="/icons/icon-96.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #212237;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 340px;
    width: 100%;
    text-align: center;
    padding: 32px 24px;
    border-radius: 24px;
    background: #2A2B46;
    border: 1px solid rgba(121,105,176,.28);
  }
  .icon {
    width: 84px; height: 84px;
    margin: 0 auto 18px;
    border-radius: 20px;
    background: #34365A;
    border: 1px solid rgba(121,105,176,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 40px; height: 40px; fill: #fff; margin-left: 4px; }
  h1 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; color: #B9B2E0; line-height: 1.55; margin-bottom: 20px; }
  button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 16px;
    background: #6A69F3;
    color: #FEFDFF;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5.5c0-1.1 1.2-1.8 2.2-1.2l8.4 5.4c.9.6.9 2 0 2.6l-8.4 5.4c-1 .6-2.2-.1-2.2-1.2V5.5z"/></svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Periksa koneksi internet kamu, lalu coba lagi. Halaman yang pernah kamu buka tetap bisa diakses dari cache.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
